#============================================================================================
# Description: Pure OpenWrt Build Workflow for MT7628 Routers (No external scripts dependency)
#============================================================================================

name: 通用设备编译固件

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "选择编译源码分支"
        required: false
        default: "immortalwrt-master"
        type: choice
        options:
          - openwrt-main
          - lede-master
          - immortalwrt-master
      
env:
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://is.gd)
          sudo mkdir -p /workdir
          sudo chown ${USER}:${GROUPS} /workdir
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 克隆官方源码
        id: codes
        working-directory: /workdir
        if: steps.init.outputs.status == 'success' && !cancelled()
        run: |
          if [[ "${{ inputs.source_branch }}" == *"openwrt"* ]]; then
              REPO_URL="https://github.com"
              REPO_BRANCH="main"
          elif [[ "${{ inputs.source_branch }}" == *"lede"* ]]; then
              REPO_URL="https://github.com"
              REPO_BRANCH="master"
          elif [[ "${{ inputs.source_branch }}" == *"immortalwrt"* ]]; then
              REPO_URL="https://github.com"
              REPO_BRANCH="master"
          fi
          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 更新并安装扩展包 (Feeds)
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 载入你的路由器配置文件
        working-directory: /workdir/openwrt
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/${CONFIG_FILE}" ]]; then
              cp -f ${GITHUB_WORKSPACE}/${CONFIG_FILE} .config
          else
              echo "警告: 未在当前仓库的 ${CONFIG_FILE} 路径下找到种子配置文件！"
          fi

      - name: 下载编译缓存包 (Download)
        working-directory: /workdir/openwrt
        run: |
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 开始核心编译 (Compile)
        working-directory: /workdir/openwrt
        run: |
          echo "$(nproc) 线程编译中..."
          make -j$(($(nproc) + 1)) V=s || make -j1 || make -j1 V=s

      - name: 提取编译出的路由器二进制固件
        id: organize
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/firmware_out
          if [ -d "/workdir/openwrt/bin/targets" ]; then
              find /workdir/openwrt/bin/targets/ -type f \( -name "*.bin" -o -name "*.trx" \) -exec cp -f {} ${GITHUB_WORKSPACE}/firmware_out/ \;
              echo "status=success" >> $GITHUB_OUTPUT
          else
              echo "错误: 未找到任何编译输出目录！"
              exit 1
          fi

      - name: 上传固件至 GitHub Artifacts (网页底部下载)
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_MT7628_Firmware
          path: ${< {GITHUB_WORKSPACE} >}/firmware_out/*

      - name: 发布至 GitHub Release (发布页面下载)
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: MT7628-OpenWrt-${{ github.run_id }}
          body: |
            MT7628NN (R101i) 路由器固件编译成功！
            默认后台网关通常为 192.168.1.1
          files: ${< {GITHUB_WORKSPACE} >}/firmware_out/*
